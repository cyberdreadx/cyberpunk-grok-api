# Publishes the GPU worker images to GHCR so Vast.ai can pull them.
# RunPod builds these same Dockerfiles itself (from GitHub); Vast can't reach
# RunPod's private registry, hence this. Images hold code only: no models,
# no secrets, no user data.
name: vast-worker-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "comfyui-worker/**"
      - ".github/workflows/vast-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pool: image
            dockerfile: comfyui-worker/Dockerfile.zimage
            context: comfyui-worker
          - pool: wan
            dockerfile: comfyui-worker/Dockerfile
            context: comfyui-worker
          - pool: ltx
            dockerfile: comfyui-worker/Dockerfile.ltx
            context: .
    steps:
      - name: Free disk space (worker images are ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gltch-worker-${{ matrix.pool }}:latest
            ghcr.io/${{ github.repository_owner }}/gltch-worker-${{ matrix.pool }}:${{ github.sha }}
