[build]
  command = "npm run build"
  publish = "dist"

# Proxy API requests to Vercel backend (must come BEFORE the SPA catch-all)
[[redirects]]
  from = "/api/*"
  to = "https://cyberpunk-grok-api.vercel.app/api/:splat"
  status = 200
  force = true

# Share pages → Vercel server-rendered HTML (OG meta tags for social previews)
[[redirects]]
  from = "/s/:id"
  to = "https://cyberpunk-grok-api.vercel.app/api/share-page?id=:id"
  status = 200
  force = true

# SPA routing — send all non-file paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
