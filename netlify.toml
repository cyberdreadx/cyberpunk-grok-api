[build]
  command = "npm run build"
  publish = "dist"

# Prevent caching on API proxy responses and service worker
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Proxy API requests to the self-hosted backend (must come BEFORE the SPA
# catch-all). The old Vercel app is DISABLED (402) — do not point back at it.
[[redirects]]
  from = "/api/*"
  to = "https://api.gltch.app/api/:splat"
  status = 200
  force = true

# Share pages → server-rendered HTML (OG meta tags for social previews)
[[redirects]]
  from = "/s/:id"
  to = "https://api.gltch.app/api/share-page?id=:id"
  status = 200
  force = true

# SPA routing — send all non-file paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
