[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Proxy API requests to Vercel backend (must come BEFORE the SPA catch-all)
[[redirects]]
  from = "/api/*"
  to = "https://cyberpunk-grok-api.vercel.app/api/:splat"
  status = 200
  force = true

# SPA routing — send all non-file paths to index.html
# Netlify automatically handles /.netlify/functions/* before redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
