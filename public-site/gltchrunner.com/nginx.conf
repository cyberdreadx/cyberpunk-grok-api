server {
    server_name gltchrunner.com www.gltchrunner.com;
    root /var/www/gltchrunner;
    index index.html;
    # Share pages + referral redirects — public links posted on Reddit/X
    # must live on this domain (gltch.app is blocked there).
    location /s/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Feed deep links (copy-link on posts/reels) — 302 to the app, args preserved.
    location = /feed {
        return 302 https://grokrunner.gltch.app/feed$is_args$args;
    }
    location ~ "^/r/([A-Za-z0-9_-]{1,32})$" {
        return 302 https://grokrunner.gltch.app/?ref=$1;
    }
    location / { try_files $uri $uri/ /index.html; }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gltchrunner.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gltchrunner.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.gltchrunner.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = gltchrunner.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name gltchrunner.com www.gltchrunner.com;
    return 404; # managed by Certbot




}